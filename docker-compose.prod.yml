services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60} --keep-alive ${GUNICORN_KEEPALIVE:-5}
    env_file: .env
    depends_on: [db,redis]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
      - media_volume:/media
    depends_on: [web]
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  worker:
    build: .
    command: celery -A config worker --loglevel=WARNING
    env_file: .env
    depends_on: [db,redis]
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
