services:
  - type: web
    name: luminousever-consulting
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput --settings=config.settings.production && python manage.py collectstatic --noinput --settings=config.settings.production
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers $GUNICORN_WORKERS --timeout $GUNICORN_TIMEOUT --keep-alive $GUNICORN_KEEPALIVE
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: luminousever-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: luminousever-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

  - type: worker
    name: luminousever-celery
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=WARNING
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          type: web
          name: luminousever-consulting
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: luminousever-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: luminousever-redis
          property: connectionString

  - type: redis
    name: luminousever-redis
    plan: starter
    ipAllowList: []

databases:
  - name: luminousever-db
    plan: starter
