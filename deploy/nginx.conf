upstream django { server web:8000; }
server {
  listen 80;
  client_max_body_size 2m;
  location /static/ { alias /static/; expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
  location /media/ { alias /media/; expires 7d; add_header Cache-Control "public, max-age=604800"; }
  location / { proxy_pass http://django; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 5s; proxy_read_timeout 60s; }
  location = /health/ { proxy_pass http://django; access_log off; }
}
