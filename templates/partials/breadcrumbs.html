{% if breadcrumbs %}<nav class="breadcrumbs" aria-label="Breadcrumb">{% for crumb in breadcrumbs %}{% if not forloop.last %}<a href="{{ crumb.url }}">{{ crumb.label }}</a><span aria-hidden="true">/</span>{% else %}<span aria-current="page">{{ crumb.label }}</span>{% endif %}{% endfor %}</nav>{% endif %}
