services:
  web:
    build: .
    env_file: .env
    depends_on: [db, redis]
    ports: ["8000:8000"]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luminousever
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    volumes: [redis_data:/data]
volumes:
  postgres_data:
  redis_data: